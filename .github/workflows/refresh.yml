name: Refresh and publish report

# GitHub starts scheduled runs late when it's busy (in practice 1 to 7 hours late at 19:45 UTC),
# so this runs four times overnight NZ time instead of once just before 9am:
# 12:23, 14:23, 16:23 and 18:23 UTC, which is 1:23am, 3:23am, 5:23am and 7:23am NZ daylight time
# (an hour earlier in NZ standard time). Each run refetches the whole campaign, so later runs pick
# up any late-attributed leads. Even if the first run is 6 hours late, figures are live by 9am NZ.
# A run can also be started by hand from the Actions tab ("Run workflow"), and any push to main
# republishes the page.
on:
  schedule:
    - cron: "23 12 * * *"
    - cron: "23 14 * * *"
    - cron: "23 16 * * *"
    - cron: "23 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull latest Meta figures
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/fetch-meta.mjs

      - name: Validate
        run: node scripts/validate.mjs

      - name: Save data to the repo
        run: |
          # Stage first so a brand new file (the first run's meta-daily.json) counts as a change.
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "No data changes."
          else
            git config user.name "lodg-report-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Daily data refresh $(TZ=Pacific/Auckland date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
