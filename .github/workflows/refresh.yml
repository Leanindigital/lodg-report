name: Refresh and publish report

# Aim: fresh figures live by 7am NZ. GitHub starts scheduled runs late when it's busy (we have
# seen 1 to 7 hours), so this runs every hour from just after midnight to 6am NZ daylight time:
# 11:07 to 17:07 UTC. Each run refetches the whole campaign, so later runs replace any figures
# from earlier runs and pick up late-attributed leads. In NZ standard time (April to September)
# the 11:07 UTC run is 11:07pm the night before and just republishes the same figures; the rest
# run from 12:07am to 5:07am.
# A run can also be started by hand from the Actions tab ("Run workflow"), and any push to main
# republishes the page.
on:
  schedule:
    - cron: "7 11-17 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull latest Meta figures
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/fetch-meta.mjs

      - name: Validate
        run: node scripts/validate.mjs

      - name: Save data to the repo
        run: |
          # Stage first so a brand new file (the first run's meta-daily.json) counts as a change.
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "No data changes."
          else
            git config user.name "lodg-report-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Daily data refresh $(TZ=Pacific/Auckland date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
